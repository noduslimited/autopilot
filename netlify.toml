[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # TRD section 12.2's example pins Node 18, written before Session 1 chose
  # Next.js 16.3.3 over the "14+" floor — Next 16 requires Node >=20.9.0
  # (confirmed via node_modules/next/package.json's engines field), so 18
  # would fail the build outright. Pinned to the LTS major that satisfies it.
  NODE_VERSION = "20"

  # Netlify's secrets scanner flags any declared env var value found
  # anywhere in build output — it can't distinguish a real leaked secret
  # from a NEXT_PUBLIC_* value that's *meant* to be inlined into the
  # client bundle (that's what the prefix is for). Confirmed via the
  # first production build's log that only these NEXT_PUBLIC_* keys and
  # two real secrets (VAPID_PRIVATE_KEY, RESEND_API_KEY) were flagged —
  # and those two only appeared inside .netlify/.next/cache/turbopack/**
  # (Turbopack's internal rebuild cache), never under .netlify/.next/static/
  # (what's actually shipped to a browser). No real leak either way; this
  # scopes the scanner instead of disabling it.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_APP_ENV,NEXT_PUBLIC_VAPID_PUBLIC_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
